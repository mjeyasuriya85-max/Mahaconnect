<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MahaConnect OTP Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 40px auto; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    #msg { margin-top: 12px; padding: 10px; background: #f2f2f2; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>OTP Test</h3>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <input id="phone" placeholder="+91XXXXXXXXXX" />
  <button id="sendBtn">Send OTP</button>
  <input id="otp" maxlength="6" placeholder="6-digit OTP" />
  <button id="verifyBtn">Verify OTP</button>
  <div id="msg"></div>

  <script>
    const API_BASE = "http://localhost:5000/api";
    const $ = (id) => document.getElementById(id);
    const show = (t) => ($("msg").textContent = t);

    async function postJson(path, body) {
      let res;
      try {
        res = await fetch(API_BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
      } catch (e) {
        throw new Error("Cannot reach backend at http://localhost:5000 (is it running?)");
      }
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((data && data.message) || "Request failed (" + res.status + ").");
      return data;
    }

    $("sendBtn").onclick = async () => {
      show("Sending...");
      try {
        const d = await postJson("/send-otp", {
          email: $("email").value.trim(),
          password: $("password").value,
          phone: $("phone").value.trim()
        });
        show("OK: " + d.message);
      } catch (e) { show("Error: " + e.message); }
    };

    $("verifyBtn").onclick = async () => {
      show("Verifying...");
      try {
        const d = await postJson("/verify-otp", {
          email: $("email").value.trim(),
          phone: $("phone").value.trim(),
          otp: $("otp").value.trim()
        });
        show("OK: " + d.message);
      } catch (e) { show("Error: " + e.message); }
    };
  </script>
</body>
</html>
