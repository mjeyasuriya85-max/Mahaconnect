<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MahaConnect | Security & Consent</title>
<meta name="description" content="Learn about privacy, data-sharing consent, and security concepts demonstrated in the MahaConnect digital services prototype.">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .security-page {
            padding: 55px 7%;
            background: #f7faff;
            min-height: 85vh;
        }

        .security-container {
            max-width: 1000px;
            margin: auto;
        }

        .security-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .security-header span {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .security-header h1 {
            color: #0f172a;
            font-size: 36px;
            margin: 10px 0;
        }

        .security-header p {
            color: #64748b;
            line-height: 1.7;
            max-width: 700px;
            margin: auto;
        }

        .security-status {
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 15px;
            padding: 22px 25px;
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 25px;
        }

        .status-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #ecfdf5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .security-status h3 {
            margin: 0 0 5px;
            color: #0f172a;
        }

        .security-status p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        .security-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .security-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 28px;
        }

        .security-card h2 {
            color: #0f172a;
            font-size: 19px;
            margin: 0 0 20px;
        }

        .security-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 17px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .security-item:last-child {
            border-bottom: none;
        }

        .security-item strong {
            display: block;
            color: #334155;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .security-item small {
            color: #94a3b8;
            font-size: 12px;
        }

        .toggle {
            position: relative;
            width: 45px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #cbd5e1;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.25s;
        }

        .slider::before {
            content: "";
            position: absolute;}
